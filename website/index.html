<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="MyAgents is a minimal, local-first interface for ACP-compatible agents."
    />
    <meta name="theme-color" content="#f4f2ec" />
    <title>MyAgents: the unified agent interface.</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        color: #191a17;
        background: #f4f2ec;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: #f4f2ec;
      }

      body {
        min-height: 100vh;
        margin: 0;
      }

      .page {
        width: min(100% - 40px, 1440px);
        min-height: 100vh;
        margin: 0 auto;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }

      header,
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 88px;
        font-size: 13px;
        letter-spacing: -0.01em;
      }

      .brand {
        font-weight: 650;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #686963;
      }

      .status::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #87a878;
        content: "";
      }

      main {
        display: flex;
        align-items: center;
        padding: 72px 0 104px;
      }

      .hero {
        max-width: 1160px;
      }

      .eyebrow {
        margin: 0 0 26px;
        color: #686963;
        font-size: 12px;
        font-weight: 650;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 1120px;
        margin: 0;
        font-size: clamp(54px, 8.8vw, 138px);
        font-weight: 520;
        letter-spacing: -0.072em;
        line-height: 0.92;
        text-wrap: balance;
      }

      .description {
        max-width: 560px;
        margin: 42px 0 0;
        color: #686963;
        font-size: clamp(17px, 1.5vw, 21px);
        letter-spacing: -0.025em;
        line-height: 1.5;
        text-wrap: pretty;
      }

      footer {
        border-top: 1px solid #d8d5cd;
        color: #686963;
      }

      .traits {
        display: flex;
        gap: 20px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      @media (max-width: 640px) {
        .page {
          width: min(100% - 28px, 1440px);
        }

        header,
        footer {
          min-height: 72px;
        }

        main {
          padding: 64px 0 80px;
        }

        .eyebrow {
          margin-bottom: 20px;
        }

        h1 {
          font-size: clamp(50px, 17vw, 82px);
          letter-spacing: -0.065em;
        }

        .description {
          margin-top: 32px;
        }

        footer {
          align-items: flex-start;
          flex-direction: column;
          justify-content: center;
          gap: 8px;
          padding: 20px 0;
        }

        .traits {
          gap: 12px;
        }
      }

      @media (prefers-reduced-motion: no-preference) {
        .hero > * {
          animation: reveal 700ms both cubic-bezier(0.22, 1, 0.36, 1);
        }

        .hero h1 {
          animation-delay: 80ms;
        }

        .hero .description {
          animation-delay: 160ms;
        }
      }

      @keyframes reveal {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header aria-label="Site header">
        <span class="brand">MyAgents</span>
        <span class="status">In development</span>
      </header>

      <main>
        <section class="hero" aria-labelledby="hero-title">
          <p class="eyebrow">One interface. Every agent.</p>
          <h1 id="hero-title">MyAgents: the unified agent interface.</h1>
          <p class="description">
            A minimal, local-first desktop client for working with your
            ACP-compatible agents in one focused place.
          </p>
        </section>
      </main>

      <footer>
        <span>Open source software</span>
        <ul class="traits" aria-label="Product principles">
          <li>Local-first</li>
          <li>Agent-agnostic</li>
          <li>Built on ACP</li>
        </ul>
      </footer>
    </div>
  </body>
</html>
